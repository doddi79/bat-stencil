[build-system]
requires = [ "setuptools>=77", "wheel" ]
build-backend = "setuptools.build_meta"

[project]
name = "batstencil"
dynamic = ["version"]
description = "An AllConf and Jinja2 powered template renderer where the context input can be files and entire directory structures can be rendered (a continuation fork of CCP Games' ccp-stencil)."
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = [ "LICENSE" ]
requires-python = ">=3.10"
authors = [
    { name = "Thordur Matthiasson", email = "doddi79@gmail.com" }
]
keywords = [ "allconf", "template", "render", "jinja2", "scaffolding", "bootstrap", "tools", "utils" ]
classifiers = [
    "Development Status :: 4 - Beta",

    "Intended Audience :: Developers",

    "Environment :: Console",

    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
    "Topic :: Utilities"
]

dependencies = [
    "batutils >=2.2, <3",
    "allconf >=4.0.2, <5",
    "jinja2 >=3.1, <4"
]

[project.optional-dependencies]
fidelius = [
    "allconf[fidelius] >=4.0.2, <5"
]

[project.scripts]
bat-stencil = "batstencil.cli.bat_stencil.main:main"

[project.urls]
Homepage = "https://github.com/doddi79/bat-stencil"
Documentation = "https://github.com/doddi79/bat-stencil/blob/main/README.md"
Repository = "https://github.com/doddi79/bat-stencil.git"
Issues = "https://github.com/doddi79/bat-stencil/issues"
Changelog = "https://github.com/doddi79/bat-stencil/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "batstencil.__version__"}

[tool.setuptools.packages.find]
where = [ "." ]
include = [ "batstencil", "batstencil.*" ]
